name: Android Stable Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.13004108

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Prepare build customization
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Prepare stable signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openminis-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/openminis-release.jks" >> "$GITHUB_ENV"

      - name: Build native dependencies and sandbox assets
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260813181013-1960c775504c
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260813181013-1960c775504c
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Test release unit logic
        working-directory: src/android
        run: ./gradlew :app:testReleaseUnitTest --tests "com.openminis.app.provider.stream.SseEventReaderTest" --tests "com.openminis.app.ui.chat.StreamingSnapshotStoreTest" --tests "com.openminis.app.ui.chat.FinalChatRowEqualityTest" --tests "com.openminis.app.ui.chat.StreamingMarkdownProgressTest" --tests "com.openminis.app.ui.chat.StreamingPresentationTest" --tests "com.openminis.app.ui.chat.BottomFollowLayoutTest" --tests "com.openminis.app.ui.chat.AssistantActionsPresentationTest" --tests "com.openminis.app.ui.chat.StreamingListMarkerPresentationTest" --tests "com.openminis.app.ui.chat.StreamingMarkupPresentationTest" --tests "com.openminis.app.ui.chat.TranslationContextIsolationTest" --tests "com.openminis.app.ui.chat.CodeBlockScrollPolicyTest" --tests "com.openminis.app.ui.chat.ThinkingScrollLayoutTest" --tests "com.openminis.app.ui.chat.ChatSearchPositionTest" --tests "com.openminis.app.ui.chat.CompactPresentationTest" --tests "com.openminis.app.ui.chat.ChatScrollGestureLayoutTest" --tests "com.openminis.app.ui.chat.CompactAttributionTest" --tests "com.openminis.app.data.model.ContextCompressionOrderTest" --tests "com.openminis.app.ui.chat.CompactModelFallbackTest" --tests "com.openminis.app.ui.chat.voice.SpeechCapsuleVisibilityTest" --tests "com.openminis.app.backup.BackupLocalCopyTest" --tests "com.openminis.app.backup.BackupPackageReaderTest" --tests "com.openminis.app.backup.BackupCryptoInteropTest" --tests "com.openminis.app.backup.BackupRecordRoundTripTest" --stacktrace

      - name: Assemble stable APK
        working-directory: src/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify stable APK signature
        run: |
          APK_PATH=$(find src/android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APK_PATH"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Upload stable APK
        uses: actions/upload-artifact@v7
        with:
          name: OpenMinis-context-compression-stable
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
